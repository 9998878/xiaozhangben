<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">

  <!-- iOS 主屏幕与状态栏 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="小账本">
  <meta name="theme-color" content="#FFCE00" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <link rel="manifest" href="pwa/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="pwa/icons/icon-180.png">

  <!-- 8 张 iOS 启动图：尺寸必须与 src/pwa/splash 下的文件一一对应 -->
  <link rel="apple-touch-startup-image" href="pwa/splash/splash-1170x2532.png"
        media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="pwa/splash/splash-1284x2778.png"
        media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="pwa/splash/splash-1179x2556.png"
        media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="pwa/splash/splash-1290x2796.png"
        media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="pwa/splash/splash-1125x2436.png"
        media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="pwa/splash/splash-828x1792.png"
        media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)">
  <link rel="apple-touch-startup-image" href="pwa/splash/splash-1242x2688.png"
        media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="pwa/splash/splash-1242x2208.png"
        media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)">

  <!-- 基础样式 → 组件样式 → 各屏幕样式（顺序冻结，不可调整） -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens/home.css">
  <link rel="stylesheet" href="css/screens/add.css">
  <link rel="stylesheet" href="css/screens/ledger.css">
  <link rel="stylesheet" href="css/screens/stats.css">
  <link rel="stylesheet" href="css/screens/accounts.css">
  <link rel="stylesheet" href="css/screens/books.css">
  <link rel="stylesheet" href="css/screens/plan.css">
  <link rel="stylesheet" href="css/screens/settings.css">

  <title>小账本</title>

  <!-- 壳层样式：只负责 #app / 导航 / 大标题 / 滚动 / 安装提示，屏幕样式仍写在各自 css -->
  <style>
    html {
      background: var(--c-bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--c-bg);
      color: var(--c-text);
    }

    #app {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    #view-root {
      height: 100%;
    }

    /* 每屏一个滚动容器：大标题随内容滚走，导航栏吸顶 */
    .app-screen {
      position: relative;
      box-sizing: border-box;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      background: var(--c-bg);
    }

    .app-screen__body {
      padding-bottom: calc(var(--h-tabbar) + var(--safe-bottom) + 24px);
    }

    #app.is-subpage .app-screen__body {
      padding-bottom: calc(var(--safe-bottom) + 24px);
    }

    .app-nav {
      position: sticky;
      top: 0;
      z-index: var(--z-sticky);
      display: flex;
      align-items: center;
      box-sizing: border-box;
      height: calc(var(--h-nav) + var(--safe-top));
      padding: var(--safe-top) var(--page-x) 0;
      background: var(--c-bg);
    }

    .app-nav--title {
      border-bottom: var(--hairline) solid var(--c-hairline);
    }

    .app-nav__back {
      display: grid;
      place-items: center;
      width: var(--h-nav);
      height: var(--h-nav);
      margin-left: calc(var(--page-x) * -1 + 4px);
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--c-tint);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* 修正：grid + 全局 svg{max-width:100%} 会把图标压成 0×0（T11 报的壳层 bug） */
    .app-nav__back svg {
      width: 24px;
      height: 24px;
      max-width: none;
      flex: none;
      display: block;
    }

    .app-nav__back:active {
      background: var(--c-pressed);
    }

    .app-nav__title {
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
      color: var(--c-text);
      font-size: var(--fs-body);
      line-height: var(--lh-body);
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-nav__spacer {
      flex: 0 0 var(--h-nav);
      width: var(--h-nav);
    }

    .app-large {
      padding: 4px var(--page-x) 10px;
    }

    .app-large .c-large-title {
      padding: 0;
    }

    .app-large .c-large-title__sub {
      margin-top: 2px;
    }

    .app-title:focus,
    .app-nav__title:focus {
      outline: none;
    }

    .app-title:focus-visible,
    .app-nav__title:focus-visible {
      outline: 2px solid var(--c-focus);
      outline-offset: 3px;
      border-radius: 8px;
    }

    .app-tabbar a {
      text-decoration: none;
    }

    /* D07：四个 Tab 均分，图标 28×28，中间不凸起 */
    .app-tabbar .c-tabbar__icon {
      width: 28px;
      height: 28px;
    }

    /* 屏幕切换：支持 View Transitions 时由浏览器接管，不支持时用同一条缓动降级 */
    @keyframes app-screen-enter {
      from {
        opacity: 0;
        transform: translate3d(14px, 0, 0);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .app-screen--enter {
      animation: app-screen-enter var(--dur-2) var(--ease-ios) both;
    }

    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: var(--dur-2);
      animation-timing-function: var(--ease-ios);
    }

    /* 启动遮罩：数据就绪后淡出，避免白屏 */
    .app-boot {
      position: fixed;
      inset: 0;
      z-index: 400;
      display: grid;
      place-items: center;
      background: var(--c-bg);
      color: var(--c-text);
      transition: opacity var(--dur-exit) var(--ease-ios);
    }

    .app-boot.is-done {
      opacity: 0;
      pointer-events: none;
    }

    .app-boot__mark {
      font-size: var(--fs-title-3);
      line-height: var(--lh-title-3);
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--c-text-2);
    }

    /* iOS 安装引导卡 */
    .app-install {
      position: fixed;
      right: 12px;
      bottom: calc(var(--h-tabbar) + var(--safe-bottom) + 12px);
      left: 12px;
      z-index: 150;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      box-sizing: border-box;
      padding: 14px;
      border: var(--hairline) solid var(--c-hairline);
      border-radius: 16px;
      background: var(--c-bg-elev);
      box-shadow: var(--shadow-2);
      opacity: 0;
      transform: translate3d(0, 8px, 0);
      transition: opacity var(--dur-2) var(--ease-ios), transform var(--dur-2) var(--ease-ios);
    }

    .app-install.is-visible {
      opacity: 1;
      transform: none;
    }

    .app-install__main {
      flex: 1 1 auto;
      min-width: 0;
    }

    .app-install__title {
      margin: 0;
      color: var(--c-text);
      font-size: var(--fs-subhead);
      line-height: var(--lh-subhead);
      font-weight: 600;
    }

    .app-install__text {
      margin: 4px 0 0;
      color: var(--c-text-2);
      font-size: var(--fs-footnote);
      line-height: var(--lh-footnote);
    }

    .app-install__close {
      display: grid;
      place-items: center;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      margin: -8px -8px 0 0;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--c-text-3);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app-install__close:active {
      background: var(--c-pressed);
    }

    /* 启动失败兜底：永远给用户一个能点的重试按钮 */
    .app-fatal {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      min-height: 100%;
      padding: 32px var(--page-x);
      text-align: center;
    }

    .app-fatal__title {
      margin: 0 0 8px;
      font-size: var(--fs-title-2);
      line-height: var(--lh-title-2);
      font-weight: 600;
    }

    .app-fatal__text {
      max-width: 320px;
      margin: 0 0 20px;
      color: var(--c-text-2);
      font-size: var(--fs-subhead);
      line-height: 21px;
    }

    .app-fatal__btn {
      min-width: 160px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: var(--c-tint);
      color: var(--c-on-tint);
      font-size: var(--fs-callout);
      font-weight: 600;
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      .app-screen--enter {
        animation: none;
      }

      .app-boot,
      .app-install {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div id="app" aria-busy="true">
    <main id="view-root"></main>

    <!-- 固定标签栏：概览 / 明细 / 统计 / 我的；图标由 app.js 注入 -->
    <nav id="tabbar" class="c-tabbar app-tabbar" aria-label="主导航">
      <a class="c-tabbar__item" href="#/home" data-tab="home">
        <span class="c-tabbar__icon" data-tab-icon="home" aria-hidden="true"></span>
        <span class="c-tabbar__label">概览</span>
      </a>
      <a class="c-tabbar__item" href="#/ledger" data-tab="ledger">
        <span class="c-tabbar__icon" data-tab-icon="list" aria-hidden="true"></span>
        <span class="c-tabbar__label">明细</span>
      </a>
      <a class="c-tabbar__compose" href="#/add" aria-label="记一笔">
        <span class="c-tabbar__compose-dot">
          <span class="c-tabbar__icon" data-tab-icon="plus" aria-hidden="true"></span>
        </span>
      </a>
      <a class="c-tabbar__item" href="#/stats" data-tab="stats">
        <span class="c-tabbar__icon" data-tab-icon="chart" aria-hidden="true"></span>
        <span class="c-tabbar__label">统计</span>
      </a>
      <a class="c-tabbar__item" href="#/settings" data-tab="settings">
        <span class="c-tabbar__icon" data-tab-icon="user" aria-hidden="true"></span>
        <span class="c-tabbar__label">我的</span>
      </a>
    </nav>
  </div>

  <!-- 浮层挂载点：sheet.js 优先使用这个容器 -->
  <div id="sheet-root"></div>

  <!-- 启动遮罩 -->
  <div id="boot" class="app-boot" role="status" aria-live="polite">
    <div class="app-boot__mark">小账本</div>
  </div>

  <noscript>
    <p style="padding: 24px; font-size: 16px; line-height: 24px;">小账本需要启用 JavaScript 才能使用。</p>
  </noscript>

  <!-- 加载顺序冻结：core → ui → router → screens → app -->
  <script defer src="js/core/money.js"></script>
  <script defer src="js/core/dates.js"></script>
  <script defer src="js/core/schema.js"></script>
  <script defer src="js/core/store.js"></script>
  <script defer src="js/core/migrate.js"></script>
  <script defer src="js/core/stats.js"></script>
  <script defer src="js/core/nl.js"></script>
  <script defer src="js/core/recurrence.js"></script>
  <script defer src="js/core/undo.js"></script>
  <script defer src="js/core/backup.js"></script>

  <script defer src="js/ui/icons.js"></script>

  <script defer src="js/ui/press.js"></script>
  <script defer src="js/ui/kit.js"></script>
  <script defer src="js/ui/sheet.js"></script>
  <script defer src="js/ui/keypad.js"></script>
  <script defer src="js/ui/charts.js"></script>
  <script defer src="js/ui/toast.js"></script>

  <script defer src="js/router.js"></script>

  <script defer src="js/screens/home.js"></script>
  <script defer src="js/screens/add.js"></script>
  <script defer src="js/screens/ledger.js"></script>
  <script defer src="js/screens/stats.js"></script>
  <script defer src="js/screens/accounts.js"></script>
  <script defer src="js/screens/books.js"></script>
  <script defer src="js/screens/plan.js"></script>
  <script defer src="js/screens/settings.js"></script>

  <script defer src="js/app.js"></script>
</body>
</html>
